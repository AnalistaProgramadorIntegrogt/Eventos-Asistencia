version: '3.8'

services:
  backend:
    build:
      context: ./AsistenciaIndustry-Back
      dockerfile: Dockerfile
    container_name: eventos_backend
    ports:
      - "5001:5001"
    env_file:
      - ./AsistenciaIndustry-Back/.env
    restart: unless-stopped
    networks:
      - default
      - app-network
    # Para desarrollo, a veces es útil mapear los volúmenes, pero aquí usamos el build estándar
    # volumes:
    #   - ./AsistenciaIndustry-Back:/app
    #   - /app/node_modules

  frontend:
    build:
      context: ./AsistenaciaIndustry-Front
      dockerfile: Dockerfile
    container_name: eventos_frontend
    ports:
      - "8080:80"
    env_file:
      - ./AsistenaciaIndustry-Front/.env
    labels:
      caddy: eventos.integro.gt
      caddy.reverse_proxy: "{{upstreams 80}}"
    networks:
      - default
      - caddy
      - app-network
    restart: unless-stopped
    depends_on:
      - backend

networks:
  app-network:
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: 1400
  caddy:
    external: true
